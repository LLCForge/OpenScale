# /etc/systemd/system/openscale-device.service.d/60-openscale-apparmor.conf
# Installed by deploy/linux/apparmor/install-apparmor.sh (#886). systemd
# switches the service into the profile before it starts; the start fails
# when the profile is not loaded (fail closed), so the script loads the
# profile first and removes this file first when rolling back.
[Service]
AppArmorProfile=openscale-device
