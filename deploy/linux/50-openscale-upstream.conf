# /etc/systemd/system/openscale-device.service.d/50-openscale-upstream.conf
#
# Upstream exit (ADR-0142): reads /etc/default/openscale-device, where
# OPENSCALE_EXIT_UPSTREAM can choose the provider profile at start. The
# upstream tunnel runs inside the openscale process (wireguard-go, its own
# TUN "os-up0"), so the unit needs no new capability: CAP_NET_ADMIN and
# /dev/net/tun are already granted. Profiles live in the state directory
# (/var/lib/openscale/device/upstream), which is already writable.
[Service]
EnvironmentFile=-/etc/default/openscale-device
