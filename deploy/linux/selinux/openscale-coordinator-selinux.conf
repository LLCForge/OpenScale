# /etc/systemd/system/openscale-coordinator.service.d/60-openscale-selinux.conf
# Installed by deploy/linux/selinux/install-selinux.sh (#886). The device
# enters openscale_device_t through its file label; the coordinator runs
# the same file, so systemd sets its domain explicitly.
[Service]
SELinuxContext=system_u:system_r:openscale_coordinator_t:s0
