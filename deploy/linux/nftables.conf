#!/usr/sbin/nft -f
# OpenScale server: everything inbound is dropped except the coordinator
# and device WireGuard ports, SSH (key only, rate limited) and essential
# ICMP. Traffic arriving through the OpenScale tunnel was already checked
# by the device's own filter against the signed rules.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		iifname "OpenScale" accept
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 5/second accept
		ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		udp dport { 41820, 41821 } accept
		tcp dport 22 ct state new limit rate 6/minute burst 6 packets accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		# Exit node: members' traffic out to the internet. The
		# openscale_exit table drops private destinations first.
		iifname "OpenScale" accept
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
