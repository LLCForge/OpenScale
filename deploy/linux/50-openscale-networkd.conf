# /etc/systemd/networkd.conf.d/50-openscale.conf (F-150, #309)
# systemd-networkd removes routes and policy rules it did not create when
# it starts or reloads; that would drop the routes and the exit node rules
# OpenScale installs. With these settings it leaves them alone.
[Network]
ManageForeignRoutes=no
ManageForeignRoutingPolicyRules=no
