# RAM mode of the coordinator (#633, ADR-0182). Install as
#   /etc/systemd/system/openscale-coordinator.service.d/50-openscale-ram.conf
# and run: systemctl daemon-reload && systemctl restart openscale-coordinator
#
# The state directory moves to /run (tmpfs): the document history, relay
# usage, the canary and the sealed blobs never reach a disk. At every start
# the directory is filled from systemd credentials (the seed); the newest
# document comes back from the devices, which upload it when the
# coordinator is behind. Turn on "ram_only" so the coordinator refuses to
# start on a disk-backed directory:
#   openscale coordinator harden --state-dir /etc/openscale/coordinator-seed --ram-only on
#
# The coordinator key should be an encrypted credential sealed to this
# server's TPM, so a copied disk does not hold it in clear:
#   systemd-creds encrypt --with-key=tpm2 --name=coordinator.key \
#       /var/lib/openscale/coordinator/coordinator.key /etc/openscale/coordinator-seed/coordinator.key.cred
# Without a TPM use --with-key=host (protects against a copied file, not
# against a copied disk). Remove the clear key afterwards.
[Service]
StateDirectory=
RuntimeDirectory=openscale-coordinator
RuntimeDirectoryMode=0700
# A service restart keeps the newer document; a reboot starts from the seed.
RuntimeDirectoryPreserve=restart
LoadCredentialEncrypted=coordinator.key:/etc/openscale/coordinator-seed/coordinator.key.cred
LoadCredential=anchor.json:/etc/openscale/coordinator-seed/anchor.json
LoadCredential=network.json:/etc/openscale/coordinator-seed/network.json
LoadCredential=state.json:/etc/openscale/coordinator-seed/state.json
LoadCredential=coordinator-hardening.json:/etc/openscale/coordinator-seed/coordinator-hardening.json
ExecStartPre=/usr/local/bin/openscale coordinator ram-seed --seed ${CREDENTIALS_DIRECTORY} --state-dir /run/openscale-coordinator
ExecStart=
ExecStart=/usr/local/bin/openscale coordinator run --state-dir /run/openscale-coordinator --listen-port 41820
