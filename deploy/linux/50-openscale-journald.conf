# journald keeps logs in memory only (#630, ADR-0182): with the
# coordinator's no-metadata mode, nothing about connections reaches a disk.
# Install as /etc/systemd/journald.conf.d/50-openscale.conf and run
# systemctl restart systemd-journald. This affects every service on the
# server: logs are lost at reboot.
[Journal]
Storage=volatile
RuntimeMaxUse=32M
MaxRetentionSec=1h
