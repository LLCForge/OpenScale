# Minimal, read-only coordinator image (#636, ADR-0184). Only systemd, the
# kernel and the static openscale binary; no package manager at run time,
# no shell login, no SSH server. The root file system is mounted read-only
# and /var is a tmpfs (systemd.volatile=state), so the coordinator runs in
# RAM mode (ADR-0182) and the image itself never changes. Updates replace
# the whole image. Build with ./hazirla.sh, then `mkosi build`.

[Distribution]
Distribution=debian
Release=bookworm

[Output]
ImageId=openscale-coordinator
Format=disk

[Content]
Bootable=yes
Packages=
        systemd
        systemd-sysv
        systemd-boot
        udev
        linux-image-cloud-amd64
        ca-certificates
# ro: read-only root; systemd.volatile=state: /var on tmpfs (state never
# reaches the image); console=ttyS0 keeps the provider console for unlock
# and rescue.
KernelCommandLine=ro systemd.volatile=state console=ttyS0 quiet
CleanPackageMetadata=yes
WithDocs=no
RemoveFiles=/usr/share/doc /usr/share/man /usr/share/locale
