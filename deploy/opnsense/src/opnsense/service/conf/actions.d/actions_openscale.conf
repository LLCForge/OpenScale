[start]
command:/usr/local/etc/rc.d/openscale start
parameters:
type:script
message:starting OpenScale

[stop]
command:/usr/local/etc/rc.d/openscale stop
parameters:
type:script
message:stopping OpenScale

[restart]
command:/usr/local/etc/rc.d/openscale restart
parameters:
type:script
message:restarting OpenScale

[status]
command:/usr/local/etc/rc.d/openscale status; exit 0
parameters:
type:script_output
message:requesting OpenScale status
